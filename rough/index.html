
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Synced Music Player</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            cursor: pointer;
        }

        #seek {
            width: min(500px, 90%);
            margin: 20px;
        }

        #status {
            color: #aaa;
        }
    </style>
</head>

<body>
    <h1>Synced Music Player</h1>

    <audio id="audio" preload="auto">
        <source src="/stream" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <div>
        <button id="play">Play</button>
        <button id="pause">Pause</button>
    </div>

    <div>
        <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
        >

        <p id="time">0:00 / 0:00</p>
    </div>

    <p id="status">Connecting...</p>

    <script>
        const audio = document.getElementById("audio");
        const playButton = document.getElementById("play");
        const pauseButton = document.getElementById("pause");
        const seek = document.getElementById("seek");
        const time = document.getElementById("time");
        const status = document.getElementById("status");

        // Automatically use WSS for HTTPS tunnel URLs.
        const protocol =
            location.protocol === "https:" ? "wss:" : "ws:";

        const ws = new WebSocket(
            `${protocol}//${location.host}`
        );

        let latestState = null;
        let applyingState = false;
        let firstSync = true;
        let isSeeking = false;

        // -------------------------
        // WebSocket commands
        // -------------------------

        function sendCommand(command) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(command));
            }
        }

        // -------------------------
        // Time display
        // -------------------------

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) {
                seconds = 0;
            }

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);

            return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
        }

        function updateTime() {
            const duration = Number.isFinite(audio.duration)
                ? audio.duration
                : 0;

            if (!isSeeking && duration > 0) {
                seek.max = duration;
                seek.value = audio.currentTime;
            }

            time.textContent =
                `${formatTime(audio.currentTime)} / ` +
                `${formatTime(duration)}`;
        }

        // -------------------------
        // Synchronize local player
        // -------------------------

        async function applyLatestState() {
            if (applyingState) return;

            applyingState = true;

            try {
                while (latestState) {
                    const state = latestState;
                    latestState = null;

                    if (state.type !== "state") continue;

                    // Wait for audio metadata before seeking.
                    if (audio.readyState < 1) {
                        await new Promise((resolve) => {
                            audio.addEventListener(
                                "loadedmetadata",
                                resolve,
                                { once: true }
                            );

                            audio.addEventListener(
                                "error",
                                resolve,
                                { once: true }
                            );
                        });
                    }

                    if (audio.error) continue;

                    // Calculate the position the song should be at now.
                    let target = Number(state.position) || 0;

                    if (
                        state.status === "playing" &&
                        Number.isFinite(state.serverTime)
                    ) {
                        target += Math.max(
                            0,
                            (Date.now() - state.serverTime) / 1000
                        );
                    }

                    if (
                        Number.isFinite(audio.duration) &&
                        audio.duration > 0
                    ) {
                        target = Math.min(target, audio.duration);
                    }

                    const drift = Math.abs(
                        audio.currentTime - target
                    );

                    // First state: always pause and seek.
                    // Later states: correct only significant drift.
                    const mustSync = firstSync || drift > 0.35;

                    if (mustSync) {
                        audio.pause();
                        audio.currentTime = target;
                    }

                    // First synchronization is done.
                    firstSync = false;

                    // Match the server's playback status.
                    if (state.status === "playing") {
                        try {
                            await audio.play();
                            status.textContent = "Connected — Playing";
                        } catch (error) {
                            status.textContent =
                                "Connected — click Play to start audio";

                            console.warn(
                                "Browser blocked playback:",
                                error
                            );
                        }
                    } else {
                        audio.pause();
                        status.textContent = "Connected — Paused";
                    }

                    updateTime();
                }
            } finally {
                applyingState = false;

                // Process any newer state received during an async operation.
                if (latestState) {
                    void applyLatestState();
                }
            }
        }

        // -------------------------
        // WebSocket events
        // -------------------------

        ws.onopen = () => {
            status.textContent = "Connected — waiting for state";
            console.log("WebSocket connected");
        };

        ws.onmessage = (event) => {
            try {
                latestState = JSON.parse(event.data);
                void applyLatestState();
            } catch (error) {
                console.error("Invalid server message:", error);
            }
        };

        ws.onclose = () => {
            status.textContent = "Disconnected";
            console.log("WebSocket disconnected");
        };

        ws.onerror = (error) => {
            status.textContent = "WebSocket error";
            console.error("WebSocket error:", error);
        };

        // -------------------------
        // User controls
        // -------------------------

        playButton.addEventListener("click", () => {
            // Start immediately from the user's gesture.
            audio.play().catch((error) => {
                console.warn("Playback failed:", error);
            });

            sendCommand({ type: "play" });
        });

        pauseButton.addEventListener("click", () => {
            sendCommand({ type: "pause" });
        });

        seek.addEventListener("input", () => {
            isSeeking = true;

            time.textContent =
                `${formatTime(Number(seek.value))} / ` +
                `${formatTime(audio.duration)}`;
        });

        seek.addEventListener("change", () => {
            const position = Number(seek.value);

            isSeeking = false;

            // Update locally immediately.
            audio.currentTime = position;

            // The server broadcasts the new position to every client.
            sendCommand({
                type: "seek",
                position
            });
        });

        // Keep the displayed position updated.
        audio.addEventListener("timeupdate", updateTime);
        audio.addEventListener("loadedmetadata", updateTime);
        audio.addEventListener("durationchange", updateTime);
    </script>
</body>
</html>
