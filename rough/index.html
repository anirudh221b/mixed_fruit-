
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synced Music Player</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        input {
            box-sizing: border-box;
            max-width: 500px;
            width: 90%;
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #292929;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px 16px;
            margin: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #seek {
            width: min(500px, 90%);
            margin: 20px;
        }

        #songList {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 20px auto;
        }

        #songList li {
            margin: 8px 0;
        }

        #songList button {
            width: 100%;
            text-align: left;
            overflow-wrap: anywhere;
        }

        #status {
            color: #aaa;
        }

        #nowPlaying {
            color: #8f8;
        }
    </style>
</head>

<body>
    <h1>Synced Music Player</h1>

    <h2>Now Playing</h2>
    <p id="nowPlaying">No song selected</p>

    <audio id="audio" preload="auto"></audio>

    <div>
        <button id="play">Play</button>
        <button id="pause">Pause</button>
    </div>

    <div>
        <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
        >
        <p id="time">0:00 / 0:00</p>
    </div>

    <hr>

    <h2>Add a Song from YouTube</h2>

    <form id="addSongForm">
        <div>
            <input
                id="youtubeUrl"
                type="url"
                placeholder="Paste YouTube URL"
                required
            >
        </div>

        <div>
            <input
                id="songName"
                type="text"
                placeholder="Custom name (without .mp3)"
                maxlength="80"
                pattern="[a-zA-Z0-9][a-zA-Z0-9 _-]{0,79}"
                title="Use letters, numbers, spaces, underscores and hyphens."
                required
            >
        </div>

        <button type="submit" id="downloadButton">
            Download &amp; Add
        </button>
    </form>

    <p id="downloadStatus"></p>

    <hr>

    <h2>Available Songs</h2>
    <button id="listSongs">List Songs</button>
    <ul id="songList"></ul>

    <p id="status">Connecting...</p>

    <script>
        const audio = document.getElementById("audio");
        const playButton = document.getElementById("play");
        const pauseButton = document.getElementById("pause");
        const seek = document.getElementById("seek");
        const time = document.getElementById("time");
        const status = document.getElementById("status");
        const nowPlaying = document.getElementById("nowPlaying");
        const songList = document.getElementById("songList");
        const listSongsButton = document.getElementById("listSongs");

        const addSongForm = document.getElementById("addSongForm");
        const youtubeUrlInput = document.getElementById("youtubeUrl");
        const songNameInput = document.getElementById("songName");
        const downloadButton = document.getElementById("downloadButton");
        const downloadStatus = document.getElementById("downloadStatus");

        const protocol =
            location.protocol === "https:" ? "wss:" : "ws:";

        const ws = new WebSocket(`${protocol}//${location.host}`);

        let latestState = null;
        let applyingState = false;
        let firstSync = true;
        let isSeeking = false;
        let selectedSong = null;
        let loadGeneration = 0;

        // -------------------------
        // Send commands
        // -------------------------

        function sendCommand(command) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(command));
            } else {
                status.textContent = "WebSocket is not connected.";
            }
        }

        // -------------------------
        // Time display
        // -------------------------

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) {
                seconds = 0;
            }

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);

            return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
        }

        function updateTime() {
            const duration = Number.isFinite(audio.duration)
                ? audio.duration
                : 0;

            if (!isSeeking && duration > 0) {
                seek.max = duration;
                seek.value = audio.currentTime;
            }

            time.textContent =
                `${formatTime(audio.currentTime)} / ${formatTime(duration)}`;
        }

        // -------------------------
        // Request and display songs
        // -------------------------

        listSongsButton.addEventListener("click", () => {
            songList.replaceChildren();

            if (ws.readyState !== WebSocket.OPEN) {
                songList.textContent = "WebSocket is not connected.";
                return;
            }

            const item = document.createElement("li");
            item.textContent = "Loading songs...";
            songList.appendChild(item);

            sendCommand({ type: "listSongs" });
        });

        function displaySongList(data) {
            songList.replaceChildren();

            if (data.error) {
                songList.textContent = data.error;
                return;
            }

            if (!data.songs || data.songs.length === 0) {
                songList.textContent = "No MP3 songs found in song_db.";
                return;
            }

            for (const song of data.songs) {
                const item = document.createElement("li");
                const button = document.createElement("button");

                button.textContent =
                    song === selectedSong ? `▶ ${song}` : song;

                button.addEventListener("click", () => {
                    sendCommand({
                        type: "selectSong",
                        song
                    });

                    status.textContent = `Selecting ${song}...`;
                });

                item.appendChild(button);
                songList.appendChild(item);
            }
        }

        // -------------------------
        // Add YouTube song
        // -------------------------

        addSongForm.addEventListener("submit", (event) => {
            event.preventDefault();

            if (!addSongForm.reportValidity()) return;

            if (ws.readyState !== WebSocket.OPEN) {
                downloadStatus.textContent = "WebSocket is not connected.";
                return;
            }

            downloadButton.disabled = true;
            downloadStatus.style.color = "#aaa";
            downloadStatus.textContent = "Sending download request...";

            sendCommand({
                type: "addSong",
                url: youtubeUrlInput.value.trim(),
                name: songNameInput.value.trim()
            });
        });

        // -------------------------
        // Load song
        // -------------------------

        function loadSong(song) {
            const generation = ++loadGeneration;

            return new Promise((resolve) => {
                let finished = false;

                const cleanup = () => {
                    audio.removeEventListener("loadedmetadata", onLoaded);
                    audio.removeEventListener("error", onError);
                };

                const finish = (success) => {
                    if (finished) return;
                    finished = true;
                    cleanup();

                    resolve({
                        success,
                        generation
                    });
                };

                const onLoaded = () => finish(true);
                const onError = () => finish(false);

                audio.addEventListener("loadedmetadata", onLoaded);
                audio.addEventListener("error", onError);

                audio.src =
                    `/stream?file=${encodeURIComponent(song)}`;

                audio.load();

                if (audio.readyState >= 1) {
                    finish(true);
                }
            });
        }

        // -------------------------
        // Apply server state
        // -------------------------

        async function applyLatestState() {
            if (applyingState) return;

            applyingState = true;

            try {
                while (latestState) {
                    const state = latestState;
                    latestState = null;

                    if (state.type !== "state") continue;
                    if (typeof state.song !== "string") continue;

                    // Switch track if the server-selected song changed.
                    if (selectedSong !== state.song) {
                        audio.pause();

                        selectedSong = state.song;
                        firstSync = true;

                        nowPlaying.textContent = state.song;
                        status.textContent = `Loading ${state.song}...`;

                        const result = await loadSong(state.song);

                        // Ignore stale async results if a newer load started.
                        if (result.generation !== loadGeneration) continue;

                        if (!result.success) {
                            status.textContent =
                                `Could not load ${state.song}`;
                            continue;
                        }

                        if (latestState) continue;
                    }

                    if (audio.readyState < 1) continue;

                    let target = Number(state.position) || 0;

                    if (
                        state.status === "playing" &&
                        Number.isFinite(state.serverTime)
                    ) {
                        target += Math.max(
                            0,
                            (Date.now() - state.serverTime) / 1000
                        );
                    }

                    if (
                        Number.isFinite(audio.duration) &&
                        audio.duration > 0
                    ) {
                        target = Math.min(target, audio.duration);
                    }

                    const drift = Math.abs(audio.currentTime - target);
                    const mustSync = firstSync || drift > 0.35;

                    if (mustSync) {
                        // First sync/new track: pause, seek, then play.
                        audio.pause();
                        audio.currentTime = target;
                    }

                    firstSync = false;

                    if (state.status === "playing") {
                        try {
                            await audio.play();
                            status.textContent = "Connected — Playing";
                        } catch (error) {
                            status.textContent =
                                "Playback blocked. Click Play to start.";

                            console.warn("Playback blocked:", error);
                        }
                    } else {
                        audio.pause();
                        status.textContent = "Connected — Paused";
                    }

                    updateTime();
                    displayCurrentSongMarker();
                }
            } finally {
                applyingState = false;

                if (latestState) {
                    void applyLatestState();
                }
            }
        }

        function displayCurrentSongMarker() {
            for (const button of songList.querySelectorAll("button")) {
                const song = button.textContent.replace(/^▶ /, "");

                button.textContent =
                    song === selectedSong ? `▶ ${song}` : song;
            }
        }

        // -------------------------
        // WebSocket events
        // -------------------------

        ws.onopen = () => {
            status.textContent = "Connected";
        };

        ws.onmessage = (event) => {
            let data;

            try {
                data = JSON.parse(event.data);
            } catch (error) {
                console.error("Invalid server message:", error);
                return;
            }

            if (data.type === "songList") {
                displaySongList(data);
                return;
            }

            if (data.type === "downloadResult") {
                downloadStatus.textContent = data.message;

                if (data.success === false) {
                    downloadStatus.style.color = "#f77";
                } else if (data.success === true) {
                    downloadStatus.style.color = "#8f8";
                } else {
                    downloadStatus.style.color = "#aaa";
                }

                if (data.success !== null) {
                    downloadButton.disabled = false;
                }

                return;
            }

            if (data.type === "error") {
                status.textContent = data.message;
                return;
            }

            if (data.type === "state") {
                latestState = data;
                void applyLatestState();
            }
        };

        ws.onclose = () => {
            status.textContent = "Disconnected";
            downloadButton.disabled = false;
        };

        ws.onerror = (error) => {
            console.error("WebSocket error:", error);
            status.textContent = "WebSocket error";
        };

        // -------------------------
        // Playback controls
        // -------------------------

        playButton.addEventListener("click", () => {
            // Immediate attempt in the user's click gesture.
            audio.play().catch((error) => {
                console.warn("Playback failed:", error);
            });

            sendCommand({ type: "play" });
        });

        pauseButton.addEventListener("click", () => {
            sendCommand({ type: "pause" });
        });

        seek.addEventListener("input", () => {
            isSeeking = true;

            time.textContent =
                `${formatTime(Number(seek.value))} / ${formatTime(audio.duration)}`;
        });

        seek.addEventListener("change", () => {
            const position = Number(seek.value);
            isSeeking = false;

            audio.currentTime = position;

            sendCommand({
                type: "seek",
                position
            });
        });

        audio.addEventListener("timeupdate", updateTime);
        audio.addEventListener("loadedmetadata", updateTime);
        audio.addEventListener("durationchange", updateTime);
    </script>
</body>
</html>
